services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: traffis-postgres
    environment:
      POSTGRES_USER: traffis
      POSTGRES_PASSWORD: traffis
      POSTGRES_DB: traffis
    ports:
      - "5432:5432"
    volumes:
      - traffis_pg:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffis -d traffis"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  traffis_pg:
